[package]
name = "s1-native"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
s1-core = { path = "../s1-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
